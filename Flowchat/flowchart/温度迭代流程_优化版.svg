<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="3100px" viewBox="0 0 2600 3100">
  <title>温度迭代识别算法流程</title>
  <desc>外层循环遍历多个温度起点，内层循环对每个温度起点迭代至收敛。</desc>
