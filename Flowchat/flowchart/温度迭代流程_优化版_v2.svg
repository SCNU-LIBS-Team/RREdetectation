<text x="1175.0" y="1915.0" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="34px" font-weight="650" fill="#202020" paint-order="stroke" stroke="#ffffff" stroke-width="12" stroke-linejoin="round">否</text>
