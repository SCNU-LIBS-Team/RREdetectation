<svg xmlns="http://www.w3.org/2000/svg" width="3600px" height="3200px" viewBox="0 0 3600 3200">
  <title>温度迭代识别算法流程（第二版）</title>
  <desc>外层遍历十个温度起点，内层在每轮迭代中更新谱线库并通过候选元素置信度计算目标温度，直到收敛或达到最大迭代次数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#3b3b3b"/>
    </marker>
  </defs>
  <rect width="3600" height="3200" fill="#ffffff"/>

<text x="1800.0" y="95.8" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="64px" font-weight="720" fill="#161616" paint-order="stroke" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"><tspan x="1800.0" y="95.8">温度迭代识别算法流程</tspan></text>
<text x="1800.0" y="153.6" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="34px" font-weight="430" fill="#5b5b5b" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"><tspan x="1800.0" y="153.6">外层遍历多个温度起点；内层对每个起点迭代更新温度并进行全局最优比较</tspan></text>
