<polygon points="2360.0,960.0 2985.0,1065.0 2360.0,1170.0 1735.0,1065.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="5" stroke-linejoin="round"/><text x="2360.0" y="1053.9" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="41px" font-weight="570" fill="#202020" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"><tspan x="2360.0" y="1053.9">是否获得有效</tspan><tspan x="2360.0" y="1103.9">候选元素？</tspan></text>
<rect x="1750" y="1190" width="1220" height="210" rx="12" ry="12" fill="#ffffff" stroke="#2f2f2f" stroke-width="5"/><text x="2360.0" y="1262.9" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="35px" font-weight="540" fill="#202020" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"><tspan x="2360.0" y="1262.9">选取置信度最高的 Top-3 候选元素</tspan><tspan x="2360.0" y="1306.9">基于置信度与 R² 评分进行 Softmax 加权</tspan><tspan x="2360.0" y="1350.9">获得目标温度</tspan></text>
