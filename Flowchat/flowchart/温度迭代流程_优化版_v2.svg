<text x="775.0" y="305.6" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="40px" font-weight="700" fill="#333333" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"><tspan x="775.0" y="305.6">外层循环：遍历 10 个温度起点</tspan></text>
<text x="2525.0" y="305.6" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="40px" font-weight="700" fill="#333333" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"><tspan x="2525.0" y="305.6">内层循环：对当前温度起点迭代更新温度</tspan></text>
<text x="2525.0" y="383.2" text-anchor="middle" font-family="Microsoft YaHei,微软雅黑,SimSun,宋体,Noto Serif SC,sans-serif" font-size="30px" font-weight="430" fill="#5b5b5b" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"><tspan x="2525.0" y="383.2">每轮均根据当前温度 T 更新基体元素谱线库；未收敛时返回该步骤</tspan></text>
